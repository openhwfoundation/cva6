# ------------------------------------------------------------------------------
#   base_rv64_h_hpm.yaml
#
#   Hypervisor tests that count events with the hardware performance counters,
#   for the cv64 targets with RVH and PerfCounterEn.
#     - hfence-gvma-gpa-high-bits: HFENCE.GVMA with an address only
#       invalidates the DTLB entry of that guest physical page, seen on the
#       DTLB miss counter.
# ------------------------------------------------------------------------------

p_test_config: &p_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"

testlist:

  - test: rv64h-p-hfence-gvma-gpa-high-bits
    iterations: 1
    <<: *p_test_config
    asm_tests: <path_var>/custom/hlvx_gstage/hfence_gvma_gpa_high_bits.S

# ------------------------------------------------------------------------------
#   base_rv64_h_pmp.yaml
#
#   Hypervisor tests that program PMP entries, for the cv64 targets with RVH
#   and PMP entries.
#     - pmp-hlvx-access-fault and pmp-misalign-priority: PMP checks on HLVX and
#       on misaligned hypervisor loads and stores.
# ------------------------------------------------------------------------------

custom_test_config: &custom_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
  llvm_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"

testlist:

  - test: pmp-hlvx-access-fault
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/pmp/hlvx_access_fault_test.S

  - test: pmp-misalign-priority
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/issues/pmp-misalign-priority-over-access-fault.S

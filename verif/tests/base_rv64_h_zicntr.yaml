# ------------------------------------------------------------------------------
#   base_rv64_h_zicntr.yaml
#
#   Hypervisor tests that read the user counters, for the cv64 targets with
#   RVH and RVZicntr.
#     - vsmode-counterh-cause: cycle from VS-mode raises a virtual instruction
#       exception when hcounteren gates it, cycleh is always illegal on RV64.
# ------------------------------------------------------------------------------

p_test_config: &p_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"

testlist:

  - test: vsmode-counterh-cause
    iterations: 1
    <<: *p_test_config
    asm_tests: <path_var>/custom/issues/vsmode_counterh_cause.S

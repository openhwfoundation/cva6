# ------------------------------------------------------------------------------
#   base_rv64_pmp_mmu_tval.yaml
#
#   PMP test that needs an MMU and checks mtval, for the cv64 targets with PMP
#   entries, an MMU and TvalEn: the LSU hands PMP the metadata of the access
#   that the MMU response answers, on DTLB-miss and DTLB-hit stores.
# ------------------------------------------------------------------------------

custom_test_config: &custom_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
  llvm_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"

testlist:
  - test: pmp-lsu-transaction
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/pmp/lsu_pipeline_store_test.S

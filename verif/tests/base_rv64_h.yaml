# ------------------------------------------------------------------------------
#   base_rv64_h.yaml
#
#   Hypervisor tests, for the cv64 targets with RVH.
#     - hlvx_gstage and gstage_store_pt_ro: two-stage walks through VS-stage
#       page tables mapped read-only or non-executable at the G stage.
#     - htval-mtval2-warl, hgatp-mode-warl, mret-mpv, i3317-reg-write: CSR
#       write rules and trap causes in and around V=1.
#     - mstatus-wpri-h: reserved mstatus fields read as zero, MPV and GVA
#       being writable.
# ------------------------------------------------------------------------------

custom_test_config: &custom_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
  llvm_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"

p_test_config: &p_test_config
  path_var: TESTS_PATH
  gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/riscv-tests/isa/macros/scalar/ -I<path_var>/riscv-tests/env/p/ -I<path_var>/riscv-tests/riscv-target/spike/"

testlist:

  - test: rv64h-p-hlvx-gstage
    iterations: 1
    <<: *p_test_config
    asm_tests: <path_var>/custom/hlvx_gstage/hlvx_gstage_repro.S

  - test: rv64h-p-gstage-store-pt-ro
    iterations: 1
    <<: *p_test_config
    asm_tests: <path_var>/custom/hlvx_gstage/gstage_store_pt_ro.S

  - test: htval-mtval2-warl
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/issues/htval-mtval2-warl-rv64.S

  - test: rv64h-p-hgatp-mode-warl
    iterations: 1
    <<: *p_test_config
    asm_tests: <path_var>/custom/hgatp_warl/hgatp_mode_warl.S

  - test: mret-mpv
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/issues/mret-mpv-rv64.S

  - test: i3317-reg-write
    iterations: 1
    <<: *custom_test_config
    asm_tests: <path_var>/custom/issues/i3317_reg_write.S

  - test: mstatus-wpri-h
    iterations: 1
    path_var: TESTS_PATH
    gcc_opts: "-DRVH -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common -lgcc"
    llvm_opts: "-DRVH -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles <path_var>/custom/common/syscalls.c <path_var>/custom/common/crt.S -I<path_var>/custom/env -I<path_var>/custom/common"
    asm_tests: <path_var>/custom/CSR/mstatus_wpri.S

  - test: rv64-hypervisor-insn
    iterations: 1
    path_var: TESTS_PATH
    gcc_opts: "-static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<path_var>/custom/env/"
    asm_tests: <path_var>/custom/sv39h/hypervisor_insn.S

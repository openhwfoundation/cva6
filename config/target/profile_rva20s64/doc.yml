# Header of the documentation generated for this target by
# `./cook.py docs-build`. See flows/README.md.
#
# `authors` lists who is responsible for it, one entry per line of
# the header: an organisation, the people it delegates to, or both.
authors:
  - "Looking for a maintainer"

# Category of this target in the dashboard (config/README.md): official,
# fpga, profile or cross
category: profile

# Role of this target among the reference points of the configuration
# matrix (config/README.md)
role: "Profile RVA20S64"

# RISC-V profile this target is closest to, and what the core lacks for
# it. Kept in sync with the support table of config/README.md.
profile:
  name: RVA20S64
  version: "ratified, profiles 1.0"
  missing: []
  partial: []

# Point of the configuration matrix (config/README.md). Axes:
matrix:
  XLEN: "64"
  C: "C"
  SS: "2c"
  Zc: "none"
  Cvxif: "noX"
  Priv: "MSU"
  MMU: "mmu"
  Mem: "HPD-WT"
  FP: "FD"
  ISA: "noB"
  Cnt: "Pch"
  Trig: "off"
  Debug: "D"
  BP: "BHT"
  Endian: "LE"
  Dcls: "-"
  Ecc: "-"
  PMP: "pmp"
  Tval: "tval"
  LdBuf: "2-15"
  LdPipe: "0"
  StPipe: "0"
  description: "cv64a6_imafdc_sv39_hpdwt_nox_nob_bht_ldb2"

# Header of the documentation generated for this target by
# `./cook.py docs-build`. See flows/README.md.
#
# `authors` lists who is responsible for it, one entry per line of
# the header: an organisation, the people it delegates to, or both.
authors:
  - "Looking for a maintainer"

# Category of this target in the dashboard (config/README.md): official,
# fpga, profile or cross
category: cross

# One-line description of this target, shown in the dashboard
role: "Generated configuration to cross the options of the core: its options may change without notice."

# Point of the configuration matrix (config/README.md). Axes:
matrix:
  XLEN: "32"
  C: "noC"
  SS: "SS+byp"
  Zc: "none"
  Cvxif: "X"
  Priv: "MSU"
  MMU: "mmu+stlb"
  Mem: "OBI"
  FP: "F"
  ISA: "B"
  Cnt: "-ch"
  Trig: "off"
  Debug: "noD"
  BP: "PH"
  Endian: "BE"
  Dcls: "-"
  Ecc: "-"
  PMP: "nopmp"
  Tval: "notval"
  LdBuf: "2-15"
  LdPipe: "2"
  StPipe: "2"
  description: "cv32a6_imf_sv32_obi_nopmp_phbp_be_nopc_ldp2"

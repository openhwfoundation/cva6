# Lint baseline of summit_oldenhorn: diagnostics per tool, severity and rule.
# Written by `./cook.py rtl-lint -t <target> --update-baseline`, read
# by rtl-lint, which fails on a new rule or a higher count.
slang:
  warning:
    finish-num: 10
    seq-no-match: 1
verilator:
  warning:
    CMPCONST: 1
    LITENDIAN: 63
    SELRANGE: 58
    UNSIGNED: 3
    WIDTHCONCAT: 2
    WIDTHEXPAND: 79
    WIDTHTRUNC: 33

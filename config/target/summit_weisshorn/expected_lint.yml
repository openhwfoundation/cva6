# Lint baseline of summit_weisshorn: diagnostics per tool, severity and rule.
# Written by `./cook.py rtl-lint -t <target> --update-baseline`, read
# by rtl-lint, which fails on a new rule or a higher count.
slang:
  warning:
    finish-num: 10
    seq-no-match: 3
verilator:
  warning:
    CASEINCOMPLETE: 2
    LITENDIAN: 8
    SELRANGE: 50
    WIDTHEXPAND: 93
    WIDTHTRUNC: 42

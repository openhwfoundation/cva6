# Bazel replaces every URL that fully matches a rewrite pattern (scheme
# excluded) with all of that pattern's replacements, in the order below,
# then tries the resulting URLs one after another. It falls back on any
# error, checksum mismatches included, and every download is pinned by
# sha256, so any extra source can only add availability.
#
# ftp.gnu.org is regularly slow or unreachable. Try the Bazel CDN first,
# then kernel.org, and keep the official server as a fallback instead of
# dropping it.
rewrite ftp\.gnu\.org/gnu/(.*) https://mirror.bazel.build/ftp.gnu.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) https://mirrors.kernel.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) https://ftp.gnu.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) https://ftpmirror.gnu.org/gnu/$1

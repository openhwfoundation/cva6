# CVA6 External Git Dependencies Configuration
#
# This file defines external Git repositories that need to be cloned
# for verification and testing (not Git submodules).
#
# Each dependency can specify:
#   - repo: Git repository URL
#   - branch: Branch to checkout
#   - commit: Specific commit hash to checkout
#   - destination: Local path where to clone
#   - patches: List of patch files to apply (optional)
#
# Patches can also be applied on the Git submodules, which are not cloned here
# but checked out by `git submodule update`. They are declared under a
# submodule_patches section, keyed by submodule path:
#
#   submodule_patches:
#     path/to/submodule:
#       patches:
#         - "verif/patches/some-fix.patch"
#         - "verif/patches/other-fix.patch:subdir"  # applied in subdir/
#       reason: >
#         Why the patch is needed, and what to watch for upstream so it can be
#         dropped once the fix lands there.
#
# This keeps a fix that is not merged upstream yet out of the submodule history,
# so its pointer keeps tracking upstream.

submodule_patches:
  verif/core-v-verif:
    patches:
      - "verif/patches/core-v-verif-axi-amo-synchronizer.patch"
    reason: >
      uvma_axi_amo_synchronizer passes the memory value between the read and the
      write halves of an atomic through a non persistent SystemVerilog event.
      When the read half runs first the notification is lost, the write half
      blocks and the AXI slave never sends the B response, which hangs the core.
      Still present on core-v-verif master: drop this patch once fixed upstream.

riscv-tests:
  repo: "https://github.com/riscv/riscv-tests.git"
  branch: "master"
  commit: "f92842f91644092960ac7946a61ec2895e543cec"
  destination: "verif/tests/riscv-tests"
  patches:
    - "verif/regress/riscv-tests.patch"
    - "verif/regress/riscv-tests-env.patch:env"  # Apply in env/ subdirectory
  submodules: true  # Clone submodules recursively

riscv-compliance:
  repo: "https://github.com/riscv-non-isa/riscv-arch-test.git"
  branch: "main"
  commit: "220e78542da4510e40eac31e31fdd4e77cdae437"
  destination: "verif/tests/riscv-compliance"
  patches:
    - "verif/regress/riscv-compliance.patch"
  submodules: false

riscv-arch-test:
  repo: "https://github.com/riscv-non-isa/riscv-arch-test"
  branch: "main"
  commit: "a5a49fc9f244192649e57fe61b4513d9bc39b1e3"
  destination: "verif/tests/riscv-arch-test"
  patches: []
  submodules: false
  post_install:
    # Copy Spike arch_test_target definitions to riscv-target subdirectory
    # Uses: $SPIKE_PATH/riscv-isa-sim/arch_test_target
    # SPIKE_PATH is defined in flows/config/setenv.sh
    copy_spike_target: true

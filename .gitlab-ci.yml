# The whole regression is driven by a single recipe: `full-regression`
# (flows/macros/full_regression.py). The job graph, the target matrix and
# the CAD license pools are described there, in Python, and are replayable
# on a workstation with the very same command:
#
#     ./cook.py full-regression
#
# The CI therefore only provides the machine, the environment and the
# publication of the dashboard: adding a target or a testlist is a change
# in the macro, not in this file.
#
# Three stages:
#   build       build spike       tandem reference model, shared between
#                                 pipelines and keyed by the core-v-verif
#                                 commit, so it is a no-op once built
#   regression  full regression   the macro, hence the whole pipeline. Every
#                                 recipe writes its own build/**/cook_report.yml
#                                 and the macro ends with merge-reports +
#                                 report-html, so the dashboard
#                                 (artifacts/reports/pipeline_report.html) is
#                                 built inside the job
#   deploy      pages             publishes that page, one deployment per
#                                 branch/MR, `when: always`
#
# The FPGA images are jobs of the macro too: the bitstream is built once
# the RTL of its target elaborates, then the board is programmed and Linux
# booted on it. The runner therefore carries Vivado, its licence and the
# connection to the board (see the variables of `full regression`).
#
# See flows/CONTINUOUS_INTEGRATION.md to add a job, a target or a testlist.

# PAGES_PREFIX is set here, next to the pipeline kind it belongs to: it
# selects the GitLab Pages parallel deployment the dashboard is published
# to (see the `pages` job). An empty prefix is the root of the site and is
# reserved for the reference run on the default branch.
workflow:
  rules:
    - if:
        $CI_PIPELINE_SOURCE == "web"
        # CI_KIND need to be set in web interface
      variables:
        PAGES_PREFIX: "br-$CI_COMMIT_REF_SLUG"
        PAGES_EXPIRE: "1 month"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        CI_KIND: verif
        PAGES_PREFIX: ""
        PAGES_EXPIRE: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        CI_KIND: dev
        PAGES_PREFIX: "mr-$CI_MERGE_REQUEST_IID"
        PAGES_EXPIRE: "1 month"
    - if: $CI_PIPELINE_SOURCE == "/.*_PR_.*/"
      variables:
        CI_KIND: dev
        PAGES_PREFIX: "br-$CI_COMMIT_REF_SLUG"
        PAGES_EXPIRE: "1 month"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PAGES_PREFIX: ""
        PAGES_EXPIRE: never
    - if: $CI_COMMIT_BRANCH =~ /^dev.*/
      variables:
        CI_KIND: dev
        PAGES_PREFIX: "br-$CI_COMMIT_REF_SLUG"
        PAGES_EXPIRE: "1 month"
    - when: never

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "1"
  CONFIG_DIR: "flows/config" #should be overloaded in gitlab CI project variables section
  TERM: xterm-256color
  FORCE_COLOR: "1"
  COLUMNS: 180
  # Concurrency of the macro scheduler. MY_JOBS caps the total number of
  # recipes running at once; the *_LICENSES variables cap each CAD license
  # pool independently, so the pipeline never asks for more licenses than
  # the site owns (see the macro docstring).
  MY_JOBS: "8"
  MY_VCS_LICENSES: "10"
  MY_SPYGLASS_LICENSES: "1"
  MY_SYNTH_LICENSES: "1"
  MY_VIVADO_LICENSES: "1"
  #PYTHONUNBEFFERED: "1"

stages:
  - build
  - regression
  - deploy

.rules_verif_regress_dev:
  rules:
    - if: $CI_KIND == "verif"
    - if: $CI_KIND == "regress"
    - if: $CI_KIND == "dev"
    - when: manual
      allow_failure: true

# ==========================================================
# BUILD
# ==========================================================

# Spike is the tandem reference model. It is built once per core-v-verif
# commit into a shared directory, so this job is a no-op (and takes a few
# seconds) as soon as another pipeline already built that commit.
build spike:
  stage: build
  tags: [$TAGS_MC_RUNNER_SIMU]
  extends:
    - .rules_verif_regress_dev
  needs: []
  before_script:
    - source $CONFIG_DIR/setenv.sh
  script:
    - echo NUMJOB=$NUM_JOBS
    - source $SYN_VCS_BASHRC
    - "export ROOT_PROJECT=$(pwd)"
    - mkdir -p tools/
    - SPIKE_INSTALL_DIR=$SPIKE_PATH/$(git -C verif/core-v-verif/ log -1 --pretty=tformat:%h --abbrev=8)/spike/
      source verif/regress/install-spike.sh

# ==========================================================
# REGRESSION
# ==========================================================

full regression:
  stage: regression
  tags: [$TAGS_MC_RUNNER_SIMU]
  extends:
    - .rules_verif_regress_dev
  needs:
    - job: build spike
      artifacts: false
  # The macro drives the FPGA board: only one pipeline at a time may run it
  resource_group: physical_fpga_lock
  # The macro plays every branch of the graph to the end even when a job
  # fails, so the job duration is bounded by the longest branch (gate-level
  # and benchmarks included), not by the sum of all recipes.
  timeout: 12h
  # The documentation is one of those branches, so the runner needs the
  # AsciiDoctor extensions and the two diagram generators, installed once
  # on the image like the CAD tools:
  #   gem install --user-install -g \
  #       docs/riscv-isa/riscv-isa-manual/dependencies/Gemfile
  #   npm install -g wavedrom-cli bytefield-svg
  #   apt install $(grep -v '^#' \
  #       docs/riscv-isa/riscv-isa-manual/dependencies/apt_packages.txt)
  # None of it is pinned upstream, so a combination that does not work
  # leaves a manual without the diagrams it could not render, which
  # docs-build reports as a failure.
  # The FPGA jobs of the macro reach the board through the environment of
  # the runner:
  #   $XILINX_VIVADO_BASHRC  settings64.sh of Vivado 2018.2, with a licence
  #                          covering the device of the board
  #   $HW_SERVER_URL         hw_server driving the board, e.g. localhost:3121
  #   $UART_SERIAL           board console, a device or a socket://host:port URL
  #   $VIVADO_CMD            vivado_lab on a runner carrying the lab edition
  #                          only, which is enough to program a board
  before_script:
    - source $CONFIG_DIR/setenv.sh
    - source $XILINX_VIVADO_BASHRC
    # setenv.sh sources the bashrc of every tool in turn, and the Verdi one
    # overwrites VCS_HOME with a version that does not match the `vcs`
    # binary put in PATH by the VCS bashrc. The job runs VCS, Spyglass
    # and DC Shell together, so re-source the VCS bashrc last to
    # restore a consistent VCS_HOME (a mismatch makes VCS abort at
    # elaboration without writing anything to its log).
    - source $SYN_VCS_BASHRC
    - pip3 install -r flows/requirements.txt
    # Point at the Spike built by the `build spike` job: it lives in a
    # shared directory keyed by the core-v-verif commit, so nothing has to
    # transit through artifacts.
    - mkdir -p tools/
    - ln -sfn $SPIKE_PATH/$(git -C verif/core-v-verif/ log -1 --pretty=tformat:%h --abbrev=8)/spike
      tools/
  script:
    - ./cook.py full-regression
      --jobs $MY_JOBS
      --vcs-licenses $MY_VCS_LICENSES
      --spyglass-licenses $MY_SPYGLASS_LICENSES
      --synth-licenses $MY_SYNTH_LICENSES
      --vivado-licenses $MY_VIVADO_LICENSES
  # Gather the per-recipe reports and tool logs under artifacts/, keeping
  # their build/ tree structure. Done here rather than through globs in
  # `artifacts:paths` because `expose_as` rejects wildcards, and in
  # after_script so the logs of a failed regression are collected too.
  # build/ itself is not archived: it also holds the simv binaries.
  after_script:
    - mkdir -p artifacts/logs
    - find build -name 'cook_report.yml' -o -name 'cook_manifest.yml' -o -name '*.log'
      | tar -cf - -T - | tar -xf - -C artifacts/logs
  artifacts:
    when: always
    expose_as: "Regression report"
    # UVM transaction logs make the whole collection weigh a few hundred
    # MB per pipeline: the dashboard itself is kept on Pages, these are
    # only needed to investigate a recent failure.
    expire_in: 2 weeks
    paths:
      # Dashboard first: this is the link exposed in the merge request
      - artifacts/reports/pipeline_report.html
      - artifacts/reports/pipeline_report.yml
      - artifacts/logs

# ==========================================================
# DASHBOARD PUBLICATION
# ==========================================================

# The dashboard is a single self-contained HTML page (no server, no
# external resource), so publishing it is just a copy into public/.
# `when: always`: a failed regression is precisely the one worth reading.
#
# One deployment per branch/MR, through `pages.path_prefix` (parallel
# deployments). The default branch is published at the root of the site,
# every other pipeline under its own prefix:
#
#   $CI_PAGES_URL/            default branch
#   $CI_PAGES_URL/mr-42/      merge request 42
#   $CI_PAGES_URL/br-dev-foo/ branch dev/foo
#
pages:
  stage: deploy
  tags: [$TAGS_MC_RUNNER_SIMU]
  extends:
    - .rules_verif_regress_dev
  needs:
    - job: full regression
      artifacts: true
  when: always
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  pages:
    path_prefix: "$PAGES_PREFIX"
    # Keep the site from accumulating one deployment per branch forever.
    # $PAGES_EXPIRE is never for the root deployment (the reference
    # dashboard of the default branch, which must stay up between two
    # nightly runs) and bounded for the per-branch/per-MR ones.
    expire_in: "$PAGES_EXPIRE"
  environment:
    name: "pages/$PAGES_PREFIX"
    url: "$CI_PAGES_URL/$PAGES_PREFIX"
  before_script: []
  script:
    - mkdir -p public
    - cp artifacts/reports/pipeline_report.html public/index.html
    - cp artifacts/reports/pipeline_report.yml public/
    # Specifications of the documented targets, published under the path
    # the dashboard links to (docs/<target>/<document>). Copied rather than
    # linked: Pages serves `public/` only.
    - cp -r artifacts/reports/docs public/docs || true
  artifacts:
    paths:
      - public

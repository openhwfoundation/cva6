# Configuration file for ReadTheDocs, used to render the CVA6
# User Manual to https://docs.openhwgroup.org/projects/cva6-user-manual.
# SPDX-License-Identifier:Apache-2.0 WITH SHL-2.1

version: 2

submodules:
  include:
    - docs/riscv-isa/riscv-isa-manual
  recursive: true

build:
  os: "ubuntu-20.04"
  tools:
    python: "3.9"
    nodejs: "20"
    ruby: "3.3"
  apt_packages:
    - cmake
    - bison
    - flex
    - libpango1.0-dev
    - libgdk-pixbuf2.0-0
    - libgtk2.0-dev
  jobs:
    post_install:
      - npm install docs/riscv-isa/riscv-isa-manual/dependencies
      - gem install -g docs/riscv-isa/riscv-isa-manual/dependencies/Gemfile
    pre_build:
      # Prepare in place: each rendered
      # manual is placed next to its page and `user_cfg_doc.rst` is
      # regenerated. This recipe does not run Sphinx: ReadTheDocs runs
      # sphinx-build itself, from the `sphinx:` section below.
      - PATH=$PWD/node_modules/.bin:$PATH ./cook.py docs-build --readthedoc

# Build from the docs directory with Sphinx
sphinx:
  configuration: docs/conf.py

# cook.py loads every recipe at startup, not only docs-build, so the
# whole flow set (plotly among it) is needed to run it
python:
  install:
    - requirements: flows/requirements.txt

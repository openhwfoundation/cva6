package:
  name: cva6
  authors:
    - "Florian Zaruba <zarubaf@iis.ee.ethz.ch>"
    - "Michael Schaffner <schaffner@iis.ee.ethz.ch>"
    - "Andreas Kuster <kustera@ethz.ch>"

# WT_DCACHE
dependencies:
  axi: { git: "https://github.com/pulp-platform/axi.git", version: 0.31.0 }
  common_cells:
    { git: "https://github.com/pulp-platform/common_cells", version: 1.23.0 }
  fpnew: { git: "https://github.com/openhwgroup/cvfpu.git", rev: 3eb6afe } # branch: develop
  tech_cells_generic:
    { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.13 }

export_include_dirs:
  - core/include

sources:
  - include_dirs:
      - core/include
    files:
      - core/include/config_pkg.sv
      # Pick the right configuration by passing the right bender flag. The
      # per-target packages live under config/target, which core/Flist.cva6
      # uses as the single source of truth for the flow.
      - target: cv32a60x
        files:
          - config/target/cv32a60x/rtl_cfg_pkg.sv

      - target: cv32a65x
        files:
          - config/target/cv32a65x/rtl_cfg_pkg.sv

      - target: fpga_linux_cv64a6
        files:
          - config/target/fpga_linux_cv64a6/rtl_cfg_pkg.sv

      - target: fpga_linux_cv32a6
        files:
          - config/target/fpga_linux_cv32a6/rtl_cfg_pkg.sv

      - target: profile_rvi20u32
        files:
          - config/target/profile_rvi20u32/rtl_cfg_pkg.sv

      - target: profile_rvi20u64
        files:
          - config/target/profile_rvi20u64/rtl_cfg_pkg.sv

      - target: profile_tinyc32
        files:
          - config/target/profile_tinyc32/rtl_cfg_pkg.sv

      - target: profile_rvm23u32
        files:
          - config/target/profile_rvm23u32/rtl_cfg_pkg.sv

      - target: profile_perf32_axi
        files:
          - config/target/profile_perf32_axi/rtl_cfg_pkg.sv

      - target: profile_perf32_obi
        files:
          - config/target/profile_perf32_obi/rtl_cfg_pkg.sv

      - target: profile_rva20s64
        files:
          - config/target/profile_rva20s64/rtl_cfg_pkg.sv

      - target: profile_rva22s64
        files:
          - config/target/profile_rva22s64/rtl_cfg_pkg.sv

      - target: profile_rva23s64
        files:
          - config/target/profile_rva23s64/rtl_cfg_pkg.sv

      - target: profile_perf64_axi
        files:
          - config/target/profile_perf64_axi/rtl_cfg_pkg.sv

      - target: summit_titlis
        files:
          - config/target/summit_titlis/rtl_cfg_pkg.sv

      - target: summit_pilatus
        files:
          - config/target/summit_pilatus/rtl_cfg_pkg.sv

      - target: summit_saentis
        files:
          - config/target/summit_saentis/rtl_cfg_pkg.sv

      - target: summit_eiger
        files:
          - config/target/summit_eiger/rtl_cfg_pkg.sv

      - target: summit_pizpalue
        files:
          - config/target/summit_pizpalue/rtl_cfg_pkg.sv

      - target: summit_toedi
        files:
          - config/target/summit_toedi/rtl_cfg_pkg.sv

      - target: summit_galenstock
        files:
          - config/target/summit_galenstock/rtl_cfg_pkg.sv

      - target: summit_dammastock
        files:
          - config/target/summit_dammastock/rtl_cfg_pkg.sv

      - target: summit_oldenhorn
        files:
          - config/target/summit_oldenhorn/rtl_cfg_pkg.sv

      - target: summit_dom
        files:
          - config/target/summit_dom/rtl_cfg_pkg.sv

      - target: summit_weisshorn
        files:
          - config/target/summit_weisshorn/rtl_cfg_pkg.sv

      - target: summit_matterhorn
        files:
          - config/target/summit_matterhorn/rtl_cfg_pkg.sv

      - target: summit_grandcombin
        files:
          - config/target/summit_grandcombin/rtl_cfg_pkg.sv

      - target: summit_dentblanche
        files:
          - config/target/summit_dentblanche/rtl_cfg_pkg.sv

      - target: summit_nadelhorn
        files:
          - config/target/summit_nadelhorn/rtl_cfg_pkg.sv

      - target: summit_grandesjorasses
        files:
          - config/target/summit_grandesjorasses/rtl_cfg_pkg.sv

      - target: summit_finsteraarhorn
        files:
          - config/target/summit_finsteraarhorn/rtl_cfg_pkg.sv

      - target: summit_monterosa
        files:
          - config/target/summit_monterosa/rtl_cfg_pkg.sv

      - target: summit_lyskamm
        files:
          - config/target/summit_lyskamm/rtl_cfg_pkg.sv

      - target: summit_barredesecrins
        files:
          - config/target/summit_barredesecrins/rtl_cfg_pkg.sv

      - target: summit_grandparadis
        files:
          - config/target/summit_grandparadis/rtl_cfg_pkg.sv

      # General config infrastructure
      - core/include/riscv_pkg.sv
      - core/include/ariane_pkg.sv
      - core/include/build_config_pkg.sv

      # MMU: instantiated only when MmuPresent, compiled for every target
      # like core/Flist.cva6
      - core/cva6_mmu/cva6_tlb.sv
      - core/cva6_mmu/cva6_shared_tlb.sv
      - core/cva6_mmu/cva6_mmu.sv
      - core/cva6_mmu/cva6_ptw.sv

      # Packages
      - core/include/wt_cache_pkg.sv

      # Extension Interface
      - core/cvxif_example/include/cvxif_instr_pkg.sv
      - core/cvxif_fu.sv
      - core/cvxif_example/cvxif_example_coprocessor.sv
      - core/cvxif_example/instr_decoder.sv

      # Tracing
      - core/cva6_rvfi_probes.sv
      - core/cva6_fifo_v3.sv
      # Top-level source files (not necessarily instantiated at the top of the cva6).
      - core/cva6.sv
      - core/alu.sv
      - core/alu_wrapper.sv
      - core/fpu_wrap.sv # depends on fpnew_pkg, above
      - core/branch_unit.sv
      - core/compressed_decoder.sv
      - core/controller.sv
      - core/csr_buffer.sv
      - core/csr_regfile.sv
      - core/decoder.sv
      - core/ex_stage.sv
      - core/instr_realign.sv
      - core/id_stage.sv
      - core/issue_read_operands.sv
      - core/issue_stage.sv
      - core/load_unit.sv
      - core/load_store_unit.sv
      - core/lsu_bypass.sv
      - core/mult.sv
      - core/multiplier.sv
      - core/serdiv.sv
      - core/perf_counters.sv
      - core/ariane_regfile_ff.sv
      - core/ariane_regfile_fpga.sv
      - core/scoreboard.sv
      - core/raw_checker.sv
      - core/store_buffer.sv
      - core/amo_buffer.sv
      - core/store_unit.sv
      - core/commit_stage.sv
      - core/axi_shim.sv

      # Frontend (i.e., fetch, decode, dispatch)
      - core/frontend/btb.sv
      - core/frontend/bht.sv
      - core/frontend/bht2lvl.sv
      - core/frontend/ras.sv
      - core/frontend/instr_scan.sv
      - core/frontend/instr_queue.sv
      - core/frontend/frontend.sv
      # Cache subsystem(s)
      - core/cache_subsystem/axi_adapter.sv

      # Physical Memory Protection
      - core/pmp/src/pmp.sv
      - core/pmp/src/pmp_entry.sv

      - include_dirs:
        - common/local/util
        files:
          - common/local/util/sram.sv

      - target: not(all(fpga, xilinx))
        include_dirs:
          - common/local/util
        files:
          - common/local/util/tc_sram_wrapper.sv

      - target: all(fpga, xilinx)
        include_dirs:
          - common/local/util
        files:
          - common/local/util/tc_sram_fpga_wrapper.sv

      - target: not(synthesis)
        include_dirs:
          - core/include
          - common/local/util
        files:
          # Tracer (behavioral code, not RTL)
          - core/include/instr_tracer_pkg.sv
          - common/local/util/instr_tracer.sv
